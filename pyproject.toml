[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-photo-edit-studio"
version = "0.8.0"
description = "Private local photo editing studio optimized for Windows and 12 GB NVIDIA GPUs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate>=1.12,<2",
  "diffusers @ git+https://github.com/huggingface/diffusers.git",
  "gradio>=6.0,<7",
  "gguf>=0.17,<1",
  "huggingface-hub[hf-transfer]>=0.36,<2",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "peft>=0.17,<1",
  "Pillow>=11,<13",
  "psutil>=5.9,<8",
  "pydantic-settings>=2.7,<3",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "transformers>=4.57,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
restore = [
  "basicsr @ git+https://github.com/XPixelGroup/BasicSR.git",
  "facexlib>=0.3.0",
  "gfpgan @ git+https://github.com/TencentARC/GFPGAN.git",
  "realesrgan>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["photo_edit_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "vendor", "models", "outputs"]
