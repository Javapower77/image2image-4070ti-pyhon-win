<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venice Studio UI Components - Extracted</title>
<style>
/* ===== Minimal theme variables needed (light theme matching the screenshots) ===== */
:root, [data-theme="light"] {
  --background-surface-chrome: #f7f5ed;
  --background-input-base: #ffffff;
  --border-input: rgba(0, 0, 0, 0.08);
  --shadow-field: 0 1px 2px 0 rgba(0,0,0,0.05);
  --chakra-radii-xl: 16px;
  --chakra-radii-lg: 12px;
  --chakra-space-1: 4px;
  --chakra-space-2: 8px;
  --chakra-sizes-4: 16px;
  --focus-ring-soft: rgba(24, 123, 216, 0.3);
  --foreground: #1b1913;
  --muted-bg: rgba(0, 0, 0, 0.04);
  --generate-bg: #1b1913;
  --generate-fg: #f7f5ed;
}

/* Dark theme alternative */
[data-theme="dark"] {
  --background-surface-chrome: #13181d;
  --background-input-base: #181e24;
  --border-input: rgba(255, 255, 255, 0.08);
  --shadow-field: 0 1px 2px 0 rgba(0,0,0,0.3);
  --foreground: #eeede4;
  --muted-bg: rgba(255, 255, 255, 0.04);
  --generate-bg: #eeede4;
  --generate-fg: #0e1217;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--background-surface-chrome);
  color: var(--foreground);
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 40px;
  align-items: flex-start;
}

/* ===== TOP TOOLBAR (mode switcher) ===== */
.venice-toolbar {
  background: var(--background-input-base);
  border-radius: var(--chakra-radii-lg);
  border: 1px solid var(--border-input);
  box-shadow: var(--shadow-field);
  padding: var(--chakra-space-1);
  display: inline-flex;
}

.venice-toolbar-stack {
  display: flex;
  align-items: center;
  flex-direction: row;
  gap: var(--chakra-space-2);
}

.venice-icon-btn {
  display: inline-flex;
  appearance: none;
  align-items: center;
  justify-content: center;
  user-select: none;
  position: relative;
  white-space: nowrap;
  vertical-align: middle;
  outline: transparent solid 2px;
  outline-offset: 2px;
  line-height: 1.2;
  border-radius: 8px;
  font-weight: 600;
  transition: all 0.2s;
  height: 40px;
  width: 40px;
  min-width: 40px;
  padding: 0;
  background: transparent;
  color: var(--foreground);
  border: none;
  cursor: pointer;
  text-decoration: none;
}

.venice-icon-btn:hover {
  background: var(--muted-bg);
}

.venice-icon-btn[data-active],
.venice-icon-btn.active {
  background: var(--muted-bg);
}

.venice-icon-btn:focus-visible {
  box-shadow: 0 0 0 3px var(--focus-ring-soft);
}

.venice-icon {
  width: 1.5em;
  height: 1.5em;
  display: inline-block;
  line-height: 1em;
  flex-shrink: 0;
  color: currentColor;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ===== MODEL SELECTOR (circle + chevron) ===== */
.venice-model-btn {
  display: inline-flex;
  appearance: none;
  align-items: center;
  justify-content: center;
  user-select: none;
  position: relative;
  white-space: nowrap;
  vertical-align: middle;
  outline: transparent solid 2px;
  outline-offset: 2px;
  border-radius: 9999px;
  font-weight: 500;
  transition: all 0.2s;
  height: 32px;
  min-width: 62px;
  padding: 0 8px;
  background: var(--muted-bg);
  color: var(--foreground);
  border: 1px solid var(--border-input);
  cursor: pointer;
  gap: 4px;
}

.venice-model-btn:hover {
  background: rgba(0,0,0,0.06);
}

.venice-model-btn:focus-visible {
  box-shadow: 0 0 0 3px var(--focus-ring-soft);
}

.venice-model-btn .chevron {
  width: 16px;
  height: 16px;
}

/* ===== GENERATE BUTTON (dark circle with arrow) ===== */
.venice-generate-btn {
  display: inline-flex;
  appearance: none;
  align-items: center;
  justify-content: center;
  user-select: none;
  position: relative;
  white-space: nowrap;
  vertical-align: middle;
  outline: transparent solid 2px;
  outline-offset: 2px;
  border-radius: 9999px;
  font-weight: 600;
  transition: all 0.2s;
  height: 32px;
  width: 32px;
  min-width: 32px;
  padding: 0;
  background: var(--generate-bg);
  color: var(--generate-fg);
  border: none;
  cursor: pointer;
}

.venice-generate-btn:hover:not(:disabled) {
  opacity: 0.9;
}

.venice-generate-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.venice-generate-btn:focus-visible {
  box-shadow: 0 0 0 3px var(--focus-ring-soft);
}

/* ===== PROMPT BAR ICON BUTTONS (smaller) ===== */
.venice-prompt-icon-btn {
  display: inline-flex;
  appearance: none;
  align-items: center;
  justify-content: center;
  user-select: none;
  position: relative;
  white-space: nowrap;
  vertical-align: middle;
  outline: transparent solid 2px;
  outline-offset: 2px;
  border-radius: 8px;
  font-weight: 500;
  transition: all 0.2s;
  height: 28px;
  min-width: 28px;
  padding: 0 6px;
  background: transparent;
  color: var(--foreground);
  border: none;
  cursor: pointer;
  font-size: 13px;
  gap: 4px;
}

.venice-prompt-icon-btn:hover {
  background: var(--muted-bg);
}

.venice-prompt-icon-btn .venice-icon {
  width: 16px;
  height: 16px;
}

/* Demo section labels */
.section-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.5;
  margin-bottom: 8px;
}
</style>
</head>
